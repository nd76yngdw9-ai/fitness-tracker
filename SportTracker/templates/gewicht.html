{% extends "base.html" %}
{% block title %}Gewicht eintragen{% endblock %}
{% block content %}

<h1>Gewicht eintragen</h1>

<form method="post" class="form">
    <label for="datum">Datum</label>
    <input type="date" id="datum" name="datum" value="{{ heute }}" required>

    <label for="wert">Gewicht (kg)</label>
    <input type="text" inputmode="decimal" id="wert" name="wert" placeholder="z.B. 88,4" required>

    <button type="submit">Speichern</button>
</form>

{% endblock %}
