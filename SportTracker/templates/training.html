{% extends "base.html" %}
{% block title %}Training eintragen{% endblock %}
{% block content %}

<h1>Training eintragen</h1>

<form method="post" class="form">
    <label for="datum">Datum</label>
    <input type="date" id="datum" name="datum" value="{{ heute }}" required>

    <label for="uebung">Übung</label>
    <input type="text" id="uebung" name="uebung" placeholder="z.B. Bankdrücken" required>

    <label for="gewicht">Gewicht (kg)</label>
    <input type="text" inputmode="decimal" id="gewicht" name="gewicht" placeholder="z.B. 120">

    <label for="wiederholungen">Wiederholungen</label>
    <input type="number" id="wiederholungen" name="wiederholungen" placeholder="z.B. 5">

    <label for="saetze">Sätze</label>
    <input type="number" id="saetze" name="saetze" placeholder="z.B. 4">

    <button type="submit">Speichern</button>
</form>

{% endblock %}
