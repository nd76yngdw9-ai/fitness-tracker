# Nur noch EIN Service -- mehrere Personen nutzen jetzt dieselbe App mit
# eigenen Benutzerkonten (Login/Registrierung), statt getrennter Container.
# SECRET_KEY unbedingt auf einen eigenen, langen Zufallswert setzen (sonst
# werden bei jedem Neustart alle Logins ungültig).

services:
  tracker:
    build: .
    container_name: fitness-tracker
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-bitte-aendern}
      ZIELGEWICHT_KG: ${ZIELGEWICHT_STANDARD:-80}
      KALORIENZIEL: ${KALORIENZIEL_STANDARD:-2500}
      # Optional: wenn gesetzt, muss man diesen Code bei der Registrierung
      # eingeben (verhindert, dass Fremde sich einfach ein Konto anlegen).
      REGISTRIERUNGS_CODE: ${REGISTRIERUNGS_CODE:-}
    volumes:
      - tracker-data:/data

volumes:
  tracker-data:
