{% extends "base.html" %}
{% block title %}Einstellungen{% endblock %}
{% block content %}

<h1>Einstellungen</h1>

<form method="post" class="form">
    <label for="zielgewicht">Zielgewicht (kg)</label>
    <input type="text" inputmode="decimal" id="zielgewicht" name="zielgewicht"
           value="{{ werte['zielgewicht'] }}" required>

    <label for="kalorienziel">Kalorienziel (kcal/Tag)</label>
    <input type="number" id="kalorienziel" name="kalorienziel"
           value="{{ werte['kalorienziel'] }}" required>

    <button type="submit">Speichern</button>
</form>

<p class="muted" style="margin-top: 16px;">
    <a href="{{ url_for('index') }}" class="link">&larr; Zurück zum Dashboard</a>
</p>

{% endblock %}
