{% extends "base.html" %}
{% block title %}Übung hinzufügen{% endblock %}
{% block content %}

<h1>Übung hinzufügen</h1>
<p class="muted">Drening vom {{ einheit["datum"] }}</p>

<form method="post" class="form" id="uebung-form">
    <label for="uebung">Übung</label>
    <div class="eingabe-mit-pfeil">
        <input type="text" id="uebung" name="uebung" list="uebungen-liste"
               placeholder="Übung wählen oder neue eintippen" required autocomplete="off"
               value="{{ vorausgefuellte_uebung }}">
        <span class="dropdown-pfeil">▾</span>
    </div>
    <datalist id="uebungen-liste">
        {% for u in uebungen %}
        <option value="{{ u['name'] }}">
        {% endfor %}
    </datalist>

    <div id="letzte-leistung" class="muted letzte-leistung"></div>

    <div class="pausen-timer-box" id="pausen-timer-box" hidden>
        <span class="muted">Pause seit letztem Satz</span>
        <span class="pausen-timer-anzeige" id="pausen-timer-anzeige">0:00</span>
    </div>

    <div id="saetze-liste" style="margin-top: 14px;"></div>

    <button type="button" id="satz-hinzufuegen-btn" class="secondary-button">
        + Satz hinzufügen
    </button>

    <button type="submit">Übung speichern</button>
</form>

<template id="satz-zeile-vorlage">
    <div class="satz-zeile">
        <div class="satz-feld">
            <label>Gewicht (kg)</label>
            <input type="text" inputmode="decimal" name="gewicht[]" placeholder="z.B. 120">
        </div>
        <div class="satz-feld">
            <label>Wdh.</label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" name="wiederholungen[]" placeholder="z.B. 5">
        </div>
        <button type="button" class="satz-entfernen-btn" title="Satz entfernen">&times;</button>
    </div>
</template>

{% endblock %}

{% block extra_scripts %}
<script>
    // Vom Server mitgegeben: für jede bekannte Übung die zuletzt eingetragene
    // Leistung, damit wir sie ohne Serveranfrage sofort anzeigen können.
    const letzteLeistung = {{ letzte_leistung_json | safe }};

    const saetzeListe = document.getElementById("saetze-liste");
    const vorlage = document.getElementById("satz-zeile-vorlage");
    const hinzufuegenBtn = document.getElementById("satz-hinzufuegen-btn");
    const uebungInput = document.getElementById("uebung");
    const letzteLeistungAnzeige = document.getElementById("letzte-leistung");

    // --- Pausentimer: reine Stoppuhr, kein Alarm/Ton. Startet (bzw. setzt
    // sich zurück auf 0:00), sobald in einer Satz-Zeile sowohl Gewicht als
    // auch Wiederholungen ausgefüllt sind und das Wdh.-Feld verlassen wird
    // -- das ist der Moment, in dem ein Satz als "eingetragen" gilt. ---
    const timerBox = document.getElementById("pausen-timer-box");
    const timerAnzeige = document.getElementById("pausen-timer-anzeige");
    let timerIntervallId = null;
    let timerStartZeit = null;

    function pausenTimerStarten() {
        timerStartZeit = Date.now();
        timerBox.hidden = false;
        if (timerIntervallId) {
            clearInterval(timerIntervallId);
        }
        timerIntervallId = setInterval(pausenTimerAktualisieren, 1000);
        pausenTimerAktualisieren();
    }

    function pausenTimerAktualisieren() {
        const vergangeneSekunden = Math.floor((Date.now() - timerStartZeit) / 1000);
        const minuten = Math.floor(vergangeneSekunden / 60);
        const sekunden = vergangeneSekunden % 60;
        timerAnzeige.textContent = minuten + ":" + String(sekunden).padStart(2, "0");
    }

    function satzZeileHinzufuegen() {
        const neueZeile = vorlage.content.cloneNode(true);
        neueZeile.querySelector(".satz-entfernen-btn").addEventListener("click", function (ereignis) {
            ereignis.target.closest(".satz-zeile").remove();
        });
        const gewichtInput = neueZeile.querySelector('input[name="gewicht[]"]');
        const wdhInput = neueZeile.querySelector('input[name="wiederholungen[]"]');
        wdhInput.addEventListener("blur", function () {
            if (gewichtInput.value.trim() && wdhInput.value.trim()) {
                pausenTimerStarten();
            }
        });
        saetzeListe.appendChild(neueZeile);
    }

    function letzteLeistungAktualisieren() {
        const eingabe = uebungInput.value.trim();
        const daten = letzteLeistung[eingabe];
        if (daten) {
            const saetzeText = daten.saetze
                .map(function (s) { return s.gewicht + "kg×" + s.wiederholungen; })
                .join(", ");
            letzteLeistungAnzeige.textContent = "Letztes Mal (" + daten.datum + "): " + saetzeText;
        } else {
            letzteLeistungAnzeige.textContent = "";
        }
    }

    uebungInput.addEventListener("input", letzteLeistungAktualisieren);
    letzteLeistungAktualisieren(); // falls das Feld schon vorausgefüllt ist
    hinzufuegenBtn.addEventListener("click", satzZeileHinzufuegen);

    // Mit 3 leeren Sätzen starten -- deckt den häufigsten Fall ab.
    satzZeileHinzufuegen();
    satzZeileHinzufuegen();
    satzZeileHinzufuegen();
</script>
{% endblock %}
